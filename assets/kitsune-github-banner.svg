<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-label="Kitsune Router GitHub Animated Hero">
  <defs>
    <clipPath id="banner-clip"><rect width="920" height="260" rx="18"/></clipPath>
    <clipPath id="hero-eye-clip"><circle cx="0" cy="0" r="4.55"/></clipPath>
    <radialGradient id="ember-glow" cx="77%" cy="54%" r="44%">
      <stop offset="0%" stop-color="#FF7D26" stop-opacity="0.38"/>
      <stop offset="62%" stop-color="#EE7522" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0D0D0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0D0F"/>
      <stop offset="58%" stop-color="#151417"/>
      <stop offset="100%" stop-color="#1E140E"/>
    </linearGradient>
    <style>
      .grid-line { stroke: #FF7D26; stroke-opacity: 0.08; stroke-width: 1; }
      .fox-float { animation: foxFloat 4.2s ease-in-out infinite; transform-origin: 42px 58px; }
      .fox-tail { animation: tailWag 1.25s ease-in-out infinite; transform-origin: 60px 50px; }
      .fox-ear-l { animation: earTwitchL 3.4s ease-in-out infinite; transform-origin: 27px 23px; }
      .fox-ear-r { animation: earTwitchR 3.4s ease-in-out infinite; transform-origin: 57px 23px; }
      .fox-face { animation: headCurious 5.6s ease-in-out infinite; }
      .fox-pupils { animation: eyeLook 5.6s ease-in-out infinite; }
      .fox-lid { animation: eyeBlink 4.4s ease-in-out infinite; transform-origin: 0px 0px; }
      .orbit-1 { animation: nodePulse 2.8s ease-in-out infinite; }
      .orbit-2 { animation: nodePulse 2.8s ease-in-out 0.9s infinite; }
      .orbit-3 { animation: nodePulse 2.8s ease-in-out 1.8s infinite; }
      .bubble-bob { animation: bubbleBob 3.2s ease-in-out infinite; }
      @keyframes foxFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-2.4px) rotate(-1.2deg); }
      }
      @keyframes tailWag {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes earTwitchL {
        0%, 82%, 100% { transform: rotate(0deg); }
        88% { transform: rotate(-8deg); }
        94% { transform: rotate(3deg); }
      }
      @keyframes earTwitchR {
        0%, 82%, 100% { transform: rotate(0deg); }
        88% { transform: rotate(7deg); }
        94% { transform: rotate(-2deg); }
      }
      @keyframes headCurious {
        0%, 18% { transform: translate(-1.6px, -0.3px); }
        34%, 52% { transform: translate(1.8px, -0.6px); }
        68%, 85% { transform: translate(0px, 0.5px); }
        100% { transform: translate(-1.6px, -0.3px); }
      }
      @keyframes eyeLook {
        0%, 18% { transform: translate(-1.25px, -0.2px); }
        34%, 52% { transform: translate(1.25px, -0.35px); }
        68%, 85% { transform: translate(-0.2px, 0.45px); }
        100% { transform: translate(-1.25px, -0.2px); }
      }
      @keyframes eyeBlink {
        0%, 92%, 96%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.08); }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 0.84; }
        50% { opacity: 1; }
      }
      @keyframes bubbleBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <g clip-path="url(#banner-clip)">
    <rect width="920" height="260" fill="url(#bg-grad)"/>
    <rect width="920" height="260" fill="url(#ember-glow)"/>
    <g class="grid-line">
      <line x1="0" y1="52" x2="920" y2="52"/><line x1="0" y1="104" x2="920" y2="104"/>
      <line x1="0" y1="156" x2="920" y2="156"/><line x1="0" y1="208" x2="920" y2="208"/>
      <line x1="115" y1="0" x2="115" y2="260"/><line x1="230" y1="0" x2="230" y2="260"/>
      <line x1="345" y1="0" x2="345" y2="260"/><line x1="460" y1="0" x2="460" y2="260"/>
      <line x1="575" y1="0" x2="575" y2="260"/>
    </g>

    <rect x="1.5" y="1.5" width="917" height="257" rx="17" fill="none" stroke="#FF7D26" stroke-opacity="0.45" stroke-width="2.5"/>

    <!-- Left typography block -->
    <g transform="translate(44 42)">
      <rect x="0" y="0" width="236" height="24" rx="12" fill="#271810" stroke="#FF7D26" stroke-width="1.3"/>
      <circle cx="14" cy="12" r="4" fill="#10B981"/>
      <text x="26" y="16" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="800" fill="#FDBA74" letter-spacing="0.6">ANTIGRAVITY MCP + PILL HUD</text>

      <text x="0" y="72" font-family="'Fraunces',Georgia,serif" font-size="44" font-weight="900" fill="#FAF7F4" letter-spacing="-0.8">KITSUNE ROUTER</text>
      <text x="2" y="102" font-family="'Segoe UI',system-ui,sans-serif" font-size="15.5" font-weight="600" fill="#D4CBC3">
        Multi-account AI bridge for Google 3.8 Pro, Deep Research,
      </text>
      <text x="2" y="124" font-family="'Segoe UI',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#FF7D26">
        Claude, DeepSeek, OpenRouter &amp; Ollama · 429 Failover + DPAPI
      </text>

      <g transform="translate(0 148)">
        <g class="orbit-1">
          <rect x="0" y="0" width="128" height="28" rx="6" fill="#181615" stroke="#FF7D26" stroke-width="1.5"/>
          <text x="64" y="18" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="800" fill="#F5F2EE">GOOGLE OAUTH</text>
        </g>
        <g class="orbit-2" transform="translate(138 0)">
          <rect x="0" y="0" width="124" height="28" rx="6" fill="#181615" stroke="#FF7D26" stroke-width="1.5"/>
          <text x="62" y="18" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="800" fill="#F5F2EE">CLAUDE + R1</text>
        </g>
        <g class="orbit-3" transform="translate(272 0)">
          <rect x="0" y="0" width="144" height="28" rx="6" fill="#FF7D26" stroke="#181615" stroke-width="1.5"/>
          <text x="72" y="18" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="900" fill="#141210">LIVE PILL HUD</text>
        </g>
      </g>
    </g>

    <!-- Speech Bubble directly above the Kitsune's head (center x = 716) -->
    <g transform="translate(620 20)">
      <g class="bubble-bob">
        <rect x="0" y="0" width="192" height="32" rx="9" fill="#271810" stroke="#FF7D26" stroke-width="1.8"/>
        <path d="M88 32 L96 42 L104 32 Z" fill="#271810" stroke="#FF7D26" stroke-width="1.6"/>
        <text x="96" y="20" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="800" fill="#FDBA74">Ready · Pronta pra rotear!</text>
      </g>
    </g>

    <!-- Ground shadow directly under Kitsune -->
    <ellipse cx="716" cy="222" rx="74" ry="10.5" fill="#000000" opacity="0.58"/>

    <!-- Static outer positioning wrapper so CSS transforms never displace coordinates -->
    <g transform="translate(618 76) scale(2.32)">
      <g class="fox-float">
        <!-- Tail -->
        <g class="fox-tail">
          <path d="M60 53.5 C71.5 53.5 76.8 45.2 77.2 33.8 C77.6 29.8 79.4 27.2 81.8 25.5 C73.2 24.4 65.2 27.6 62.2 37.0 L59.5 47.0 Z" fill="none" stroke="#585C63" stroke-width="5.2" stroke-linejoin="round"/>
          <path d="M60 53.5 C71.5 53.5 76.8 45.2 77.2 33.8 C77.6 29.8 79.4 27.2 81.8 25.5 C73.2 24.4 65.2 27.6 62.2 37.0 L59.5 47.0 Z" fill="#EE7522"/>
          <path d="M66.2 33.2 L69.2 36.2 L71.8 32.8 L74.6 36.6 L77.4 33.8 C77.8 30.2 79.6 27.2 81.8 25.5 C74.4 24.6 68.8 27.4 66.2 33.2 Z" fill="#FFFFFF"/>
          <path d="M60 53.5 C71.5 53.5 76.8 45.2 77.2 33.8 C77.6 29.8 79.4 27.2 81.8 25.5 C73.2 24.4 65.2 27.6 62.2 37.0 L59.5 47.0 Z" fill="none" stroke="#2B2E33" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
        <!-- Ears -->
        <g class="fox-ear-l">
          <path d="M20.2 28.5 C17.8 20.5 18.2 13.0 20.6 7.5 C26.6 9.8 31.8 14.4 34.8 19.6 Z" fill="none" stroke="#585C63" stroke-width="5.2" stroke-linejoin="round"/>
          <path d="M20.2 28.5 C17.8 20.5 18.2 13.0 20.6 7.5 C26.6 9.8 31.8 14.4 34.8 19.6 Z" fill="#EE7522" stroke="#2B2E33" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M21.8 25.5 C20.4 20.4 20.6 15.0 22.0 11.4 C25.6 13.2 29.0 16.4 31.2 20.4 Z" fill="#FAF0DE"/>
        </g>
        <g class="fox-ear-r">
          <path d="M63.8 28.5 C66.2 20.5 65.8 13.0 63.4 7.5 C57.4 9.8 52.2 14.4 49.2 19.6 Z" fill="none" stroke="#585C63" stroke-width="5.2" stroke-linejoin="round"/>
          <path d="M63.8 28.5 C66.2 20.5 65.8 13.0 63.4 7.5 C57.4 9.8 52.2 14.4 49.2 19.6 Z" fill="#EE7522" stroke="#2B2E33" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M62.2 25.5 C63.6 20.4 63.4 15.0 62.0 11.4 C58.4 13.2 55.0 16.4 52.8 20.4 Z" fill="#FAF0DE"/>
        </g>
        <!-- Loaf body -->
        <g>
          <path d="M33.5 19.2 C38.8 17.2 45.2 17.2 50.5 19.2 C57.5 22.4 62.5 29.5 64.5 34.4 Q67.6 37.0 67.8 39.2 C67.5 41.2 65.4 42.8 64.2 44.4 C64.2 51.6 63.8 55.8 62.4 58.6 C61.2 60.4 59.0 60.6 55.5 60.6 L28.5 60.6 C25.0 60.6 22.8 60.4 21.6 58.6 C20.2 55.8 19.8 51.6 19.8 44.4 C18.6 42.8 16.5 41.2 16.2 39.2 Q16.4 37.0 19.5 34.4 C21.5 29.5 26.5 22.4 33.5 19.2 Z" fill="none" stroke="#585C63" stroke-width="5.2" stroke-linejoin="round"/>
          <path d="M33.5 19.2 C38.8 17.2 45.2 17.2 50.5 19.2 C57.5 22.4 62.5 29.5 64.5 34.4 Q67.6 37.0 67.8 39.2 C67.5 41.2 65.4 42.8 64.2 44.4 C64.2 51.6 63.8 55.8 62.4 58.6 C61.2 60.4 59.0 60.6 55.5 60.6 L28.5 60.6 C25.0 60.6 22.8 60.4 21.6 58.6 C20.2 55.8 19.8 51.6 19.8 44.4 C18.6 42.8 16.5 41.2 16.2 39.2 Q16.4 37.0 19.5 34.4 C21.5 29.5 26.5 22.4 33.5 19.2 Z" fill="#EE7522"/>
          <path d="M17.0 39.0 C22.5 36.2 27.6 36.4 32.5 37.8 C36.8 39.0 40.0 37.4 42.0 37.4 C44.0 37.4 47.2 39.0 51.5 37.8 C56.4 36.4 61.5 36.2 67.0 39.0 L63.8 44.2 C58.5 47.8 54.0 49.4 51.2 49.8 L50.8 52.8 L48.2 51.8 L47.0 54.8 L44.4 53.6 L42.0 57.0 L39.6 53.6 L37.0 54.8 L35.8 51.8 L33.2 52.8 L32.8 49.8 C30.0 49.4 25.5 47.8 20.2 44.2 Z" fill="#FFFFFF"/>
          <path d="M33.5 19.2 C38.8 17.2 45.2 17.2 50.5 19.2 C57.5 22.4 62.5 29.5 64.5 34.4 Q67.6 37.0 67.8 39.2 C67.5 41.2 65.4 42.8 64.2 44.4 C64.2 51.6 63.8 55.8 62.4 58.6 C61.2 60.4 59.0 60.6 55.5 60.6 L28.5 60.6 C25.0 60.6 22.8 60.4 21.6 58.6 C20.2 55.8 19.8 51.6 19.8 44.4 C18.6 42.8 16.5 41.2 16.2 39.2 Q16.4 37.0 19.5 34.4 C21.5 29.5 26.5 22.4 33.5 19.2 Z" fill="none" stroke="#2B2E33" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M19.8 44.0 C24.5 48.0 30.2 49.8 34.4 50.3" fill="none" stroke="#2B2E33" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M64.2 44.0 C59.5 48.0 53.8 49.8 49.6 50.3" fill="none" stroke="#2B2E33" stroke-width="2.3" stroke-linecap="round"/>
          <ellipse cx="26.0" cy="59.6" rx="5.0" ry="2.2" fill="#583722" stroke="#2B2E33" stroke-width="1.6"/>
          <ellipse cx="58.0" cy="59.6" rx="5.0" ry="2.2" fill="#583722" stroke="#2B2E33" stroke-width="1.6"/>
        </g>
        <!-- Face + enlarged +20% eyes (outer <g> positions eye, inner .fox-lid scales locally around 0,0) -->
        <g class="fox-face">
          <ellipse cx="24.2" cy="44.2" rx="4.1" ry="1.65" fill="#F39EA8"/>
          <ellipse cx="59.8" cy="44.2" rx="4.1" ry="1.65" fill="#F39EA8"/>
          <g transform="translate(31.6 33.8)">
            <g class="fox-lid">
              <circle r="6.6" fill="#2B2E33"/><circle r="4.65" fill="#FFFFFF"/>
              <g clip-path="url(#hero-eye-clip)"><g class="fox-pupils">
                <circle r="3.75" fill="#121417"/><circle cx="-1.25" cy="-1.2" r="1.42" fill="#FFFFFF"/><circle cx="1.45" cy="1.38" r="0.68" fill="#FFFFFF"/>
              </g></g>
            </g>
          </g>
          <g transform="translate(52.4 33.8)">
            <g class="fox-lid">
              <circle r="6.6" fill="#2B2E33"/><circle r="4.65" fill="#FFFFFF"/>
              <g clip-path="url(#hero-eye-clip)"><g class="fox-pupils">
                <circle r="3.75" fill="#121417"/><circle cx="-1.25" cy="-1.2" r="1.42" fill="#FFFFFF"/><circle cx="1.45" cy="1.38" r="0.68" fill="#FFFFFF"/>
              </g></g>
            </g>
          </g>
          <path d="M39.5 38.4 Q42 37.6 44.5 38.4 Q44.6 40.2 42 41.3 Q39.4 40.2 39.5 38.4 Z" fill="#2B2E33"/>
          <path d="M42 41.1 L42 42.5 M38.2 42.2 C38.5 44.8 41.8 44.6 42 42.5 C42.2 44.6 45.5 44.8 45.8 42.2" fill="none" stroke="#2B2E33" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- Signature PRESS beret -->
        <g>
          <path d="M21.6 25.8 C19.8 20.6 23.2 14.4 39.2 14.0 C52.8 13.8 58.6 18.2 58.8 22.8 C52.6 27.0 35.8 28.4 21.6 25.8 Z" fill="none" stroke="#585C63" stroke-width="4.2" stroke-linejoin="round"/>
          <path d="M21.6 25.8 C19.8 20.6 23.2 14.4 39.2 14.0 C52.8 13.8 58.6 18.2 58.8 22.8 C52.6 27.0 35.8 28.4 21.6 25.8 Z" fill="#1E1F24" stroke="#18181B" stroke-width="1.6" stroke-linejoin="round"/>
          <ellipse cx="40.2" cy="16.4" rx="5.5" ry="1.1" fill="#464A52"/>
          <path d="M23.0 23.0 C22.8 18.8 31.4 16.8 41.5 17.5 C48.2 18.0 52.8 19.0 54.6 20.4 L53.2 23.6 C45.0 21.5 31.0 21.5 23.0 23.0 Z" fill="#FF7D26"/>
          <g transform="translate(55 15.5) rotate(17)">
            <rect x="-10.5" y="-4.8" width="21" height="9.6" rx="2.0" fill="#585C63" stroke="#585C63" stroke-width="1.6"/>
            <rect x="-9.8" y="-4.2" width="19.6" height="8.4" rx="1.6" fill="#18181B"/>
            <rect x="-8.6" y="-3.0" width="17.2" height="6.0" rx="1.0" fill="#FFFFFF"/>
            <text x="0" y="1.7" font-family="'JetBrains Mono',Consolas,monospace" font-weight="900" font-size="5.3" fill="#18181B" text-anchor="middle">PRESS</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
